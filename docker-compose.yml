services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: "3001"
      SESSION_DIR: /app/sessions
      # Keep legacy mount readable so startup can migrate /app/data → /app/sessions
      LEGACY_SESSION_DIR: /app/data
      RUNS_ROOT: /tmp/scraper-runs
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    shm_size: "1gb"
    volumes:
      - scraper_sessions:/app/sessions
      - auth-state:/app/data
      - ./scraper-runs:/tmp/scraper-runs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/status').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy

volumes:
  scraper_sessions:
  auth-state:
